# Netlify builds the web app from app/ on every push.
[build]
  base = "app"
  command = "npm run build"
  publish = "dist"
  # The hidden SOL bank. The build bundles netlify/functions/sponsor.mjs with all its libraries
  # into netlify/functions-dist/, so it runs on any Node version Netlify uses.
  functions = "netlify/functions-dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_CLUSTER = "devnet"
