[package]
name = "honor-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Separate workspace so test-only dependencies never touch the on-chain build.
[workspace]

[dev-dependencies]
honor = { path = "../programs/honor", features = ["no-entrypoint"] }
anchor-lang = "=0.32.1"
litesvm = "0.7.1"
solana-keypair = "2.2"
solana-signer = "2.2"
solana-transaction = "2.2"
solana-message = "2.4"
solana-clock = "2.2"
solana-sha256-hasher = "2.3"
serde_json = "1"
